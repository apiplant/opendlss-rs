[package]
name = "opendlss-nr"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Linux Rust host and model validator for the OpenDLSS-NR Vulkan implementation"

[lib]
name = "opendlss_nr"
path = "src/lib.rs"

[[bin]]
name = "opendlss-nr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ash = "0.37.3"
bytemuck = { version = "1.21", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
libloading = "0.8"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wgpu = "30"

[dev-dependencies]
tempfile = "3.15"
